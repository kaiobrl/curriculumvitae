<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Currículo de Kaiobrl - Desenvolvedor Web Frontend">
    <meta name="author" content="Kaiobrl">
    <meta name="theme-color" content="#003147">
    <title>Kaiobrl | Desenvolvedor Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer-when-downgrade" />
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script type="application/ld+json" id="json-ld"></script>
</head>

<body>
    <canvas id="particles-canvas"></canvas>

    <div class="reading-progress" id="readingProgress"></div>

    <button class="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <i class="fas fa-moon"></i>
    </button>

    <main class="cv-container">
        <aside class="cv-sidebar" role="complementary" aria-label="Informações pessoais">
            <header class="profile-header" id="profileHeader"></header>

            <section class="sidebar-section" aria-labelledby="contact-title" id="contactSection"></section>
            <section class="sidebar-section" aria-labelledby="education-title" id="educationSection"></section>
            <section class="sidebar-section" aria-labelledby="languages-title" id="languagesSection"></section>
            <section class="sidebar-section" aria-labelledby="skills-title" id="skillsSection"></section>
        </aside>

        <div class="cv-main">
            <section class="main-section about-section" aria-labelledby="about-title" id="aboutSection"></section>
            <section class="main-section experience-section" aria-labelledby="experience-title" id="experienceSection"></section>
            <section class="main-section projects-section" aria-labelledby="projects-title" id="projectsSection"></section>
            <section class="main-section interests-section" aria-labelledby="interests-title" id="interestsSection"></section>
            <section class="main-section certifications-section" aria-labelledby="certs-title" id="certificationsSection"></section>
            <section class="main-section contact-form-section" aria-labelledby="form-title" id="contactFormSection"></section>

            <footer class="cv-footer">
                <div class="footer-left">
                    <p>© 2026 Kaiobrl. <span id="footerText"></span> <i class="fas fa-heart"></i></p>
                    <p class="visitor-count"><i class="fas fa-eye"></i> <span id="visitorCount">0</span></p>
                </div>
                <div class="footer-right">
                    <div class="lang-switch">
                        <button data-lang="pt" class="lang-btn active" aria-label="Português">PT</button>
                        <button data-lang="en" class="lang-btn" aria-label="English">EN</button>
                    </div>
                    <button class="share-btn" aria-label="Compartilhar" title="Compartilhar">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </footer>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
